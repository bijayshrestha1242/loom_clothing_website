
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Loom Clothing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <h1>
                <a href="homepage.html">Loom Clothing</a>
            </h1>

            <ul class="nav-links">
          
                <li><a href="homepage.html">Home</a></li>
                <li><a href="womens_clothing.html">Women's Clothing</a></li>
                <li><a href="mens_clothing.html">Men's Clothing</a></li>
            </ul>
        </nav>
    </header>

   <main class="auth-main">
        <section class="auth-card" aria-labelledby="authTitle">
            <p class="auth-eyebrow">LOOM CLOTHING</p>
            <h1 id="authTitle">Welcome back</h1>
            <p class="auth-intro">Log in to your Loom account.</p>
            <form id="loginForm" class="auth-form">
                <div class="auth-field">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" name="email" autocomplete="email" required>
                </div>
                <div class="auth-field">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit">Login</button>
            </form>
            <p class="auth-switch">Not a Loom member yet? <a href="register.html">Join now</a></p>
            <p>Are you the website owner or manager? <a href="admin_login.html">Sign in here</a></p>
        </section>
    <script src="script.js"></script>
</body>
</html>
