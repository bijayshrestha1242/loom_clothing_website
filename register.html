
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Loom Clothing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 <main class="auth-main">
        <section class="auth-card" aria-labelledby="authTitle">
            <p class="auth-eyebrow">LOOM CLOTHING</p>
            <h1 id="authTitle">Create an account</h1>
            <p class="auth-intro">Join the Loom family. Find your next favourite fit.</p>
            <form id="registerForm" class="auth-form">
                <div class="auth-field">
                    <label for="registerName">Name</label>
                    <input type="text" id="registerName" name="name" autocomplete="name" required>
                </div>
                <div class="auth-field">
                    <label for="registerEmail">Email</label>
                    <input type="email" id="registerEmail" name="email" autocomplete="email" required>
                </div>
                <div class="auth-field">
                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" name="password" autocomplete="new-password" required minlength="8" aria-describedby="passwordHint">
                    <p id="passwordHint" class="auth-hint">Use at least 8 characters.</p>
                </div>
                <button type="submit">Register</button>
            </form>
            <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
