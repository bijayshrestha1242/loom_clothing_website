<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <nav>
            <h1>
                <a href="homepage.html">Loom Clothing</a>
            </h1>

            <ul>
                <li><a href="homepage.html">Home</a></li>
                <li><a href="mens_clothing.html">Men's Clothing</a></li>
                <li><a href="womens_clothing.html">Women's Clothing</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Checkout</h2>
            <p>Review your order and proceed to payment.</p>
        </section>

        <section>
            <h2>Your Order</h2>
            <ul id="cartItems"></ul>
            <p id="cartTotal">Total: $0.00</p>
        </section>

        <section>
            <h2>Customer Information</h2>

            <form>

                <label for="name">Full Name:</label>
                <input type="text" id="name" required>

                <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" required>

                <br><br>

                <label for="address">Contact Number:</label>
                <input type="text" id="number" required>

                <br><br>
            </form>
        </section>

        <section>
            <h2>Delivery Method</h2>

            <input type="radio" id="delivery" name="deliveryMethod" value="delivery">
            <label for="delivery">Delivery</label>

            <br><br>

            <input type="radio" id="clickCollect" name="deliveryMethod" value="clickCollect">
            <label for="clickCollect">Click & Collect</label>
        </section>
    </main>

    <script src="script.js"></script>

</body>
</html>
