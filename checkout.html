<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <nav>
            <h1>
                <a href="homepage.html">Loom Clothing</a>
            </h1>

            <ul>
                <li><a href="homepage.html">Home</a></li>
                <li><a href="mens_clothing.html">Men's Clothing</a></li>
                <li><a href="womens_clothing.html">Women's Clothing</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Checkout</h2>
            <p>Review your order and proceed to payment.</p>
        </section>

        <section>
            <h2>Your Order</h2>
            <ul id="cartItems"></ul>
            <p id="cartTotal">Total: $0.00</p>
        </section>

        <section>
            <h2>Customer Information</h2>

            <form>

                <label for="name">Full Name:</label>
                <input type="text" id="name" required>

                <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" required>

                <br><br>

                <label for="number">Contact Number:</label>
                <input type="text" id="number" required>

                <br><br>

                <div id="addressSection">
                    <label for="address">Address:</label>
                    <input type="text" id="address" required>
                </div>
            </form>
        </section>

        <section>
            <h2>Delivery Method</h2>

            <input type="radio" id="delivery" name="deliveryMethod" value="delivery" onclick="showDelivery()">
            <label for="delivery">Delivery</label>

            <br><br>

            <input type="radio" id="clickCollect" name="deliveryMethod" value="clickCollect" onclick="showPickup()">
            <label for="clickCollect">Click & Collect</label>

            <div id="pickupLocation" style="display: none;">
                <h3>Pickup Location</h3>
                
                <select id="pickupSelect">
                    <option value="store1">Fremantle Store</option>
                </select>
            </div>
        </section>

        <section>
            <h2>Discount Code</h2>
                <label for="discountCode">Enter Discount Code:</label>
                <input type="text" id="discountCode">
                <button onclick="applyDiscount()">Apply</button>
                <p id="discountMessage"></p>
            </h2>
        </section>

        <section>
            <h2>Payment Method</h2>

            <input type="radio" id="card" name="paymentMethod" value="card"
            onclick="showCardDetails()">
            <label for="card">Credit/Debit Card</label>

            <br><br>

            <input type="radio" id="paypal" name="paymentMethod" value="paypal"
            onclick="hideCardDetails()">
            <label for="paypal">PayPal</label>

            <br><br>

            <input type="radio" id="afterpay" name="paymentMethod" value="afterpay"
            onclick="hideCardDetails()">
            <label for="afterpay">Afterpay</label>

            <div id="cardDetails" style="display: none;">
                <h3>Card Details</h3>

                <label for="cardNumber">Card Number:</label>
                <input type="text" id="cardNumber">

                <br><br>

                <label for="expiryDate">Expiry Date:</label>
                <input type="text" id="expiryDate" placeholder="MM/YY">

                <br><br>

                <label for="cvv">CVV:</label>
                <input type="text" id="cvv">
            </div>
        </section>

        <section>
            <br><br>
            <button onclick="placeOrder()">Place Order</button>
            <p id="orderMessage"></p>
        </section>

    </main>

    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">

</body>
</html>
