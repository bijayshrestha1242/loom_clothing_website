<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Women's Clothing</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="catalog-page">

    <header>
        <nav>
            <h1 class="logo">
                <a href="homepage.html">Loom Clothing</a>
            </h1>

            <ul class="nav-links">
                <li><a href="homepage.html">Home</a></li>
                <li><a href="mens_clothing.html">Men's Clothing</a></li>
                <li><a href="order_history.html">My Orders</a></li>
                <span id="loginNavigation">
                    <li><a href="login.html">Login</a></li>
                </span>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Women's Clothing</h2>
            <p>Explore our collection of women's clothing and find the perfect outfit for any occasion.</p>
        </section>

        <section>
            <h3>Filter Products</h3>

            <label for="filterType">Filter By:</label>
            <select id="filterType" onchange="showFilterOptions()">
                <option value="none">Select Filter</option>
                <option value="price">Price</option>
                <option value="size">Size</option>
                <option value="colour">Colour</option>
                <option value="availability">Availability</option>
            </select>

            <select id="filterOption" onchange="filterProducts()" style="display: none;">
            </select>
        </section>
        
        <section class="product-grid" id="productList" data-category="Womens"></section>

         <section>
            <h2>Your Cart</h2>
            <ul id="cartItems"></ul>
            <p id="cartTotal">Total: $0.00</p>
            <button onclick="goToCheckout()">Checkout</button>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
